# Python Language Configuration

display_name: "Python"

file_extensions:
  - ".py"
  - ".pyw"
  - ".pyi"
  - ".ipynb"

comment_style: "#"

doc_style: "\"\"\""

keywords:
  - "False"
  - "None"
  - "True"
  - "and"
  - "as"
  - "assert"
  - "async"
  - "await"
  - "break"
  - "class"
  - "continue"
  - "def"
  - "del"
  - "elif"
  - "else"
  - "except"
  - "finally"
  - "for"
  - "from"
  - "global"
  - "if"
  - "import"
  - "in"
  - "is"
  - "lambda"
  - "nonlocal"
  - "not"
  - "or"
  - "pass"
  - "raise"
  - "return"
  - "try"
  - "while"
  - "with"
  - "yield"
  - "self"
  - "cls"
  - "__init__"
  - "__name__"
  - "__main__"
  - "match"
  - "case"
  - "type"
