# Vue.js Language Configuration

display_name: "Vue.js"

file_extensions:
  - ".vue"

comment_style: "//"

doc_style: "/**/"

keywords:
  - "template"
  - "script"
  - "style"
  - "setup"
  - "export"
  - "default"
  - "const"
  - "let"
  - "var"
  - "function"
  - "async"
  - "await"
  - "import"
  - "from"
  - "return"
  - "if"
  - "else"
  - "for"
  - "while"
  - "do"
  - "switch"
  - "case"
  - "break"
  - "continue"
  - "try"
  - "catch"
  - "finally"
  - "throw"
  - "new"
  - "this"
  - "class"
  - "extends"
  - "static"
  - "get"
  - "set"
  - "true"
  - "false"
  - "null"
  - "undefined"
  - "typeof"
  - "instanceof"
  - "in"
  - "of"
  - "delete"
  - "void"
  - "yield"
  - "ref"
  - "reactive"
  - "computed"
  - "watch"
  - "watchEffect"
  - "onMounted"
  - "onUnmounted"
  - "onBeforeMount"
  - "onBeforeUnmount"
  - "onUpdated"
  - "onBeforeUpdate"
  - "props"
  - "emit"
  - "defineProps"
  - "defineEmits"
  - "defineExpose"
  - "withDefaults"
  - "v-if"
  - "v-else"
  - "v-else-if"
  - "v-for"
  - "v-model"
  - "v-bind"
  - "v-on"
  - "v-show"
  - "v-html"
  - "v-text"
  - "v-slot"
